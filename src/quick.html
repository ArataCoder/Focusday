<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><title>Focusday — быстрый захват</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;font:15px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#f3f4f8}
body{padding:14px}
form{display:flex;align-items:center;gap:12px;height:100%;padding:0 10px 0 18px;border-radius:18px;
  background:linear-gradient(160deg,rgba(36,36,48,.9),rgba(14,15,20,.94));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(143,125,255,.45),0 0 0 6px rgba(143,125,255,.14),0 24px 60px -16px rgba(0,0,0,.8);
  animation:in .45s cubic-bezier(.34,1.56,.64,1) both}
svg{width:20px;height:20px;fill:none;stroke:#ffc46b;stroke-width:1.8;stroke-linejoin:round;flex:none}
input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:inherit;font:inherit;font-size:17px}
input::placeholder{color:#6f7486}
kbd{font:600 11px/1 Consolas,monospace;color:#6f7486;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.1)}
@keyframes in{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <form id="f" autocomplete="off">
    <svg viewBox="0 0 24 24"><path d="M13 2.5 4.5 13.5H12l-1 8 8.5-11H12l1-8Z"/></svg>
    <input id="q" maxlength="160" placeholder="Выгрузи мысль…  завтра · 15м · ! · #работа" autofocus>
    <kbd>Enter</kbd>
  </form>
  <script src="quick.js"></script>
</body>
</html>
