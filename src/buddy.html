<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focusday — котик</title>
<link rel="stylesheet" href="cat.css">
<style>
  /* Отдельное прозрачное окно поверх всех программ (Windows). Котик — в правом нижнем углу окна,
     пузырь — слева от него. Размер окна меняет Rust: small 132×132 / large 340×250. */
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;
    font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .cat-buddy{position:fixed;left:auto;right:8px;bottom:6px;flex-direction:row-reverse}
  .cat-bubble{width:210px;margin-bottom:40px;border-radius:18px 18px 6px 18px}
  .cat-buddy:not([hidden]){display:flex}
</style>
</head>
<body>
<div class="cat-buddy" id="catBuddy" hidden></div>
<script type="module" src="buddy.js"></script>
</body>
</html>
