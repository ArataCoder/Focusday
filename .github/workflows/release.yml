# Сборка Focusday.exe в облаке GitHub — без установки Rust на свой ПК.
# Запуск: вкладка Actions → "Release Windows" → Run workflow, либо git tag v1.3.0 && git push --tags
# Сначала прогоняются автотесты; если они упали — EXE не собирается.
name: Release Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npm test                                  # юнит-тесты (node --test)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e                          # палитра, котик, цитаты, звуки, синхронизация (mock)

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm install
      - run: npm run bundle -- --minify               # src/js/* → src/focusday.js (tauri build тоже это делает)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: '1.3.7'
          releaseName: 'Focusday 1.3.7 — тест котика для Windows'
          releaseDraft: true
          prerelease: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Focusday-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/focusday.exe
