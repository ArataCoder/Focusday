# Экспериментально: APK для Android в облаке GitHub (Tauri 2 Mobile). Запуск вручную: Actions → "Build Android APK".
# Нужно один раз локально выполнить `npm run android:init` и закоммитить папку src-tauri/gen/android.
name: Build Android APK
on: workflow_dispatch

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm install
      - run: npm run android:build
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
      - uses: actions/upload-artifact@v4
        with:
          name: Focusday-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
